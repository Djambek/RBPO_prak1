on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: maven:4.0.0-rc-5-eclipse-temurin-25-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven
          restore-keys: |
            ${{ runner.os }}-maven

      - name: build project
        run: mvn clean package -DskipTests

      - name: move artifacts
        run: |
          mkdir artifacts
          mv ./target/*.jar ./artifacts/build.jar

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: artifacts/build.jar
          name: app-jar

  dependency-check:
    needs: build
    runs-on: ubuntu-latest
    container: maven:4.0.0-rc-5-eclipse-temurin-25-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Dependency Check DB
        uses: actions/cache@v4
        with:
          path: ./dc-data
          key: ${{ runner.os }}-dep-check-db

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check -Dformat=HTML -DdataDirectory=./dc-data
        env:
          NVD_API_KEY: ${{ secrets.NVD_API }}

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ./target/dependency-check-report.html

  semgrep:
    needs: build
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scanning
        run: semgrep scan --pro --sarif --output ./semgrep.sarif ./
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

    continue-on-error: true

  dast_baseline:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Application in background
        run: |
          java -jar target/build.jar &
          sleep 30

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          allow_issue_writing: false
          artifact_name: 'zapbaseline'
          cmd_options: '-r report_html.html'

      - name: Upload Baseline Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-artifact
          path: report_html.html

  dast_api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Application in background
        run: |
          java -jar target/build.jar &
          sleep 30

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: openapi
          allow_issue_writing: false
          artifact_name: 'zap-api-data'
          cmd_options: '-r report_html.html'

      - name: Upload API Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-artifact
          path: report_html.html