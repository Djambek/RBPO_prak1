on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: maven:4.0.0-rc-5-eclipse-temurin-25-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: build project
        run: mvn clean package -DskipTests
      
      - name: move artifacts
        run: | 
            mkdir artifacts
            mv ./target/*.jar ./artifacts/build.jar
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: artifacts/
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - name: Scanning
        run: |
          mkdir artifacts
          semgrep scan --pro --sarif --output ./artifacts/semgrep.sarif ./
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_TOKEN }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: artifacts/

    continue-on-error: true
